[project]
name = "eliteprocareers"
version = "0.1.0"
description = "ElitePro AI Platform — job discovery, scoring, and application automation"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=5.0",
    "pycountry>=24.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
eliteprocareers = ["models/all-MiniLM-L6-v2/**/*"]

[tool.vercel]
entrypoint = "src.eliteprocareers.api.main:app"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
